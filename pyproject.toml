[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ios-test-automator"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "streamlit>=1.40",
    "requests>=2.32",
    "python-dotenv>=1.0",
]
